name: telegram-post
on:
  schedule:
    - cron: '3,13,23,33,43,53 15-19 * * *'   # 18:03–22:53 МСК каждые 10 мин (не ровные минуты — GitHub реже их пропускает)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: telegram-post   # два запуска подряд не должны отправить одно и то же дважды
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # свежая очередь с отметками sent, а не снимок на момент запуска
      - run: command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)   # обложка и запасной замер размеров
      - run: python3 scripts/telegram_post.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: '@clooqs'
      - run: |
          if ! git diff --quiet; then
            git config user.name "clooqs-bot"; git config user.email "bot@clooqs.invalid"
            git commit -am "Telegram queue: mark sent"; git pull --rebase -q; git push
          fi
